<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000"/>
<title>Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#000;--line:#1c1c1e;--text:#f5f5f7;--muted:#8e8e93;--accent:#ff4d3a;--blue:#3897f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:#000;position:relative}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(0,0,0,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{font-family:"Playfair Display",serif;font-size:26px;margin:0}
.icon{width:40px;height:40px;display:grid;place-items:center;font-size:20px;position:relative}
.pip{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px;scrollbar-width:none}
.st{width:74px;flex:0 0 auto;text-align:center;font-size:11px;color:var(--muted)}
.ring{width:66px;height:66px;margin:0 auto 6px;padding:2px;border-radius:50%;background:conic-gradient(from 200deg,#ff4d3a,#f7c948,#7ae7c7,#7c5cff,#ff4d3a)}
.ring.seen{background:#333}
.ring i{height:100%;border-radius:50%;border:3px solid #000;display:grid;place-items:center;font-weight:800}
.post{border-bottom:1px solid var(--line);padding-bottom:8px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.nm{font-size:13px;font-weight:700}.nm small{display:block;color:var(--muted);font-weight:500}
.media{background:#111;aspect-ratio:1}.media img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;align-items:center;padding:6px 6px 0}.acts button{font-size:22px;padding:6px 8px}.acts .r{margin-left:auto}
.meta{padding:0 14px 12px;font-size:14px;line-height:1.4}
.likes{font-weight:700;margin-bottom:4px}.time{color:var(--muted);font-size:11px;margin-top:4px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);display:flex;background:#000;border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{flex:1;color:var(--muted);font-size:11px;font-weight:700}.tabbar button.on{color:#fff}
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:360px;text-align:center}
.box h1{font-family:"Playfair Display",serif;font-size:42px;margin:0 0 8px}.box p{color:var(--muted)}
.box input{width:100%;background:#121212;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin:6px 0}
.pri{width:100%;background:var(--blue);color:#fff;border-radius:10px;padding:12px;font-weight:700;margin-top:8px}
.ghost{color:var(--muted);margin-top:12px}.err{color:#ff6b7a;font-size:13px}
.search{margin:10px 12px;background:#1c1c1e;border-radius:12px;padding:10px 12px;width:calc(100% - 24px);border:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img,.tile{aspect-ratio:1;width:100%;object-fit:cover;background:#1a1a1a;border:0}
.sheet{position:fixed;inset:0;background:#000c;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panel{width:min(480px,100%);background:#161616;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.reels{height:calc(100dvh - 56px);overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:calc(100dvh - 56px);scroll-snap-align:start;position:relative;background:#111}
.reel img{width:100%;height:100%;object-fit:cover}
.reel .ov{position:absolute;left:14px;right:70px;bottom:24px}.reel .side{position:absolute;right:10px;bottom:80px;display:grid;gap:16px;text-align:center}
.prof{padding:14px 14px 80px}.stats{display:flex;gap:18px;margin:10px 0;font-size:13px;color:var(--muted)}.stats b{color:#fff;display:block;font-size:16px}
.edit{border:1px solid #333;border-radius:10px;padding:7px 12px;font-weight:700;width:100%;margin:8px 0}
.chat{padding:8px 12px 90px}.bubble{max-width:78%;padding:9px 12px;border-radius:16px;margin:6px 0;background:#1c1c1e}.bubble.me{background:#1b3a2f;margin-left:auto}
.composer{position:sticky;bottom:58px;display:flex;gap:8px;padding:8px;background:#000}.composer input{flex:1;background:#1c1c1e;border:0;border-radius:20px;padding:10px 14px}
.admin table{width:100%;border-collapse:collapse;font-size:13px}.admin td,.admin th{border-bottom:1px solid #222;padding:8px;text-align:left}
.pill{background:#1c1c1e;border-radius:8px;padding:6px 8px;font-size:12px}
.row{display:flex;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="pulse.ig.v3", CODE="FERRARI1";
const $=s=>document.querySelector(s);
const now=()=>Date.now();
const ago=t=>{const s=Math.max(1,(now()-t)/1000|0);if(s<60)return s+"s";const m=s/60|0;if(m<60)return m+"m";const h=m/60|0;if(h<24)return h+"h";return (h/24|0)+"d"};
const col=h=>"hsl("+h+" 70% 42%)";
const pic=(s,w=900,h=900)=>"https://picsum.photos/seed/"+s+"/"+w+"/"+h;
function seed(){
  const U=(id,username,display,h,bio,ver)=>({id,username,display,pass:"pulse123",bio,h,ver:!!ver,followers:120+h,following:80,blocked:false});
  const users=[U("you","you","Jordan Hale",18,"Sunsets, trails, making things."),U("nova","nova","Nova Chen",262,"Night sky diaries.",1),U("milo","milo","Milo Park",32,"Bread and broth.",1),U("rio","rio","Rio Alvarez",198,"Tiny games, big heart.",1),U("iris","iris","Iris Holm",280,"Type and paper.",1),U("sage","sage","Sage Okonkwo",148,"Quiet miles.")];
  const P=(id,by,text,seed,hours,likes,reels)=>({id,by,text,img:pic(seed),t:now()-hours*3600000,likes,comments:[{by:"you",text:"This is beautiful."}],saved:[],reels:!!reels});
  return {users,follows:[["you","nova"],["you","milo"],["you","iris"],["nova","you"]],posts:[P("p1","nova","Perseids over the ridge.","stars1",2,["you","iris","rio"],1),P("p2","milo","Sunday loaf. Crust sang when I cut it.","bread1",5,["you","sage"]),P("p3","iris","Harbor Grotesk, first specimen.","type1",9,["you","nova"],1),P("p4","sage","Fog was the whole view.","trail1",14,["you"]),P("p5","rio","New tileset for the lighthouse keeper.","pixel1",20,["you","iris"],1)],stories:users.map(u=>({id:"s"+u.id,by:u.id,img:pic("st"+u.id,720,1280),seen:false})),convos:[{id:"c1",with:"nova",msgs:[{by:"nova",text:"Did you catch the north sky?"},{by:"you",text:"Two meteors and a raccoon."}]}],notes:[{id:1,text:"nova liked your post",read:false},{id:2,text:"iris started following you",read:false},{id:3,text:"milo sent a message",read:false}],session:null,owner:false};
}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.users)return x}catch(e){} const d=seed();save(d);return d}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
let db=load(), route="home", viewUser=null, openStory=null, sheet=null, chatId="c1";
const me=()=>db.users.find(u=>u.id===db.session);
const usr=id=>db.users.find(u=>u.id===id);
function go(r){route=r;sheet=null;openStory=null;render()}
function av(u,sz){sz=sz||36;return '<div class="av" style="width:'+sz+'px;height:'+sz+'px;background:'+col(u.h)+'">'+u.display[0]+'</div>'}
function login(){const id=$("#id").value.trim().toLowerCase(),pw=$("#pw").value;const u=db.users.find(x=>x.username===id);if(!u||u.pass!==pw||u.blocked){$("#err").textContent=u&&u.blocked?"Account suspended":"Wrong username or password";return}db.session=u.id;save(db);go("home")}
function signup(){const id=$("#id").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,""),pw=$("#pw").value;if(pw.length<6){$("#err").textContent="Use 6+ characters";return}if(db.users.some(u=>u.username===id)){$("#err").textContent="Username taken";return}const u={id:"u"+now(),username:id,display:id,pass:pw,bio:"New on Pulse",h:(Math.random()*360)|0,ver:false,followers:0,following:0,blocked:false};db.users.push(u);db.session=u.id;save(db);go("home")}
function like(id){const p=db.posts.find(x=>x.id===id);const i=p.likes.indexOf(me().id);if(i<0)p.likes.push(me().id);else p.likes.splice(i,1);save(db);render()}
function saveP(id){const p=db.posts.find(x=>x.id===id);const i=p.saved.indexOf(me().id);if(i<0)p.saved.push(me().id);else p.saved.splice(i,1);save(db);render()}
function comment(id){const t=prompt("Comment");if(!t)return;db.posts.find(x=>x.id===id).comments.push({by:me().id,text:t});db.notes.unshift({id:now(),text:"New comment on a post",read:false});save(db);render()}
function share(){db.convos[0].msgs.push({by:me().id,text:"Shared a Pulse"});save(db);go("messages")}
function follow(id){const has=db.follows.some(f=>f[0]===me().id&&f[1]===id);if(has)db.follows=db.follows.filter(f=>!(f[0]===me().id&&f[1]===id));else db.follows.push([me().id,id]);save(db);render()}
function publish(){const t=($("#cap")||{}).value||"";const f=$("#file");const finish=img=>{db.posts.unshift({id:"p"+now(),by:me().id,text:t||"New Pulse",img:img,t:now(),likes:[],comments:[],saved:[],reels:false});save(db);go("home")};if(f&&f.files&&f.files[0]){const r=new FileReader();r.onload=function(){finish(r.result)};r.readAsDataURL(f.files[0])}else finish(pic("new"+now()))}
function send(){const t=$("#mtext").value.trim();if(!t)return;db.convos.find(c=>c.id===chatId).msgs.push({by:me().id,text:t});save(db);render()}
function unlock(){if((($("#oc").value)||"").trim()===CODE){db.owner=true;save(db);render()}else alert("Wrong owner code")}
function wipe(id){db.posts=db.posts.filter(p=>p.by!==id);save(db);render()}
function ban(id){usr(id).blocked=true;if(db.session===id)db.session=null;save(db);render()}
function verify(id){usr(id).ver=!usr(id).ver;save(db);render()}
function postHTML(p){const a=usr(p.by),liked=p.likes.includes(me().id),saved=p.saved.includes(me().id);return '<article class="post"><div class="ph">'+av(a)+'<div class="nm">'+a.display+(a.ver?" \u2713":"")+'<small>@'+a.username+'</small></div></div><div class="media" onclick="like(\''+p.id+'\')"><img src="'+p.img+'" alt=""></div><div class="acts"><button onclick="like(\''+p.id+'\')">'+(liked?"\u2764\ufe0f":"\u1f90d")+'</button><button onclick="comment(\''+p.id+'\')">\ud83d\udcac</button><button onclick="share()">\u2708\ufe0f</button><button class="r" onclick="saveP(\''+p.id+'\')">'+(saved?"\ud83d\udd16":"\ud83d\udcc4")+'</button></div><div class="meta"><div class="likes">'+p.likes.length+' likes</div><div><b>'+a.username+'</b> '+p.text+'</div><div class="time" onclick="comment(\''+p.id+'\')">View all '+p.comments.length+' comments \u00b7 '+ago(p.t)+' ago</div></div></article>'}
function homeView(){return '<div class="top"><h1 class="logo">Pulse</h1><div class="row"><button class="icon" onclick="go(\'notes\')">\u2661'+(db.notes.some(n=>!n.read)?'<i class="pip"></i>':'')+'</button><button class="icon" onclick="go(\'messages\')">\u2708</button></div></div><div class="stories">'+db.stories.map(function(s){const u=usr(s.by);return '<button class="st" onclick="openStory=\''+s.id+'\';render()"><div class="ring '+(s.seen?'seen':'')+'"><i style="background:'+col(u.h)+'">'+u.display[0]+'</i></div>'+(s.by===me().id?'Your story':u.username)+'</button>'}).join('')+'</div>'+db.posts.map(postHTML).join('')}
function searchView(){const people=db.users.filter(u=>u.id!==me().id);return '<div class="top"><h1 class="logo">Explore</h1></div><input class="search" id="q" placeholder="Search"><div class="grid">'+db.posts.map(function(p){return '<button class="tile" onclick="go(\'home\')"><img src="'+p.img+'"></button>'}).join('')+'</div><div style="padding:12px">'+people.map(function(u){return '<div class="ph">'+av(u)+'<div class="nm">'+u.display+'<small>@'+u.username+'</small></div><button class="pri" style="width:auto;padding:7px 12px;margin:0 0 0 auto" onclick="follow(\''+u.id+'\')">'+(db.follows.some(f=>f[0]===me().id&&f[1]===u.id)?'Following':'Follow')+'</button></div>'}).join('')+'</div>'}
function createView(){return '<div class="top"><h1 class="logo">New Pulse</h1></div><div style="padding:16px"><input id="file" type="file" accept="image/*"><textarea id="cap" placeholder="Write a caption..." style="width:100%;min-height:120px;margin-top:12px;background:#121212;border:1px solid #222;border-radius:12px;padding:12px"></textarea><button class="pri" onclick="publish()">Share</button></div>'}
function reelsView(){const list=db.posts.filter(p=>p.reels);const rows=list.length?list:db.posts;return '<div class="reels">'+rows.map(function(p){return '<div class="reel"><img src="'+p.img+'"><div class="side"><button onclick="like(\''+p.id+'\')">\u2764\ufe0f<br>'+p.likes.length+'</button><button onclick="comment(\''+p.id+'\')">\ud83d\udcac</button><button onclick="saveP(\''+p.id+'\')">\ud83d\udd16</button></div><div class="ov"><b>@'+usr(p.by).username+'</b><div>'+p.text+'</div></div></div>'}).join('')+'</div>'}
function notesView(){db.notes.forEach(n=>n.read=true);save(db);return '<div class="top"><button onclick="go(\'home\')">\u2039</button><h1 class="logo">Activity</h1><span></span></div>'+db.notes.map(function(n){return '<div class="ph"><div class="nm">'+n.text+'<small>just now</small></div></div>'}).join('')}
function messagesView(){const c=db.convos.find(x=>x.id===chatId);const other=usr(c.with);return '<div class="top"><button onclick="go(\'home\')">\u2039</button><div class="nm">'+other.display+'<small>Active now</small></div><span></span></div><div class="chat">'+c.msgs.map(function(m){return '<div class="bubble '+(m.by===me().id?'me':'')+'">'+m.text+'</div>'}).join('')+'</div><div class="composer"><input id="mtext" placeholder="Message..."><button class="pri" style="width:auto;margin:0" onclick="send()">Send</button></div>'}
function profileView(){const u=usr(viewUser||me().id);const mine=u.id===me().id;const posts=db.posts.filter(p=>p.by===u.id);const saved=db.posts.filter(p=>p.saved.includes(u.id));return '<div class="top"><h1 class="logo">'+u.username+'</h1>'+(mine?'<button onclick="sheet=\'menu\';render()">\u2630</button>':'<button onclick="go(\'home\')">\u2039</button>')+'</div><div class="prof"><div class="ph">'+av(u,74)+'<div class="stats"><div><b>'+posts.length+'</b>posts</div><div><b>'+u.followers+'</b>followers</div><div><b>'+u.following+'</b>following</div></div></div><div class="nm" style="padding:0 4px">'+u.display+(u.ver?' \u2713':'')+'<small>'+u.bio+'</small></div>'+(mine?'<button class="edit" onclick="sheet=\'edit\';render()">Edit profile</button>':'<button class="pri" onclick="follow(\''+u.id+'\')">'+(db.follows.some(f=>f[0]===me().id&&f[1]===u.id)?'Following':'Follow')+'</button>')+'<div class="grid" style="margin-top:12px">'+posts.map(function(p){return '<img src="'+p.img+'">'}).join('')+'</div>'+(mine?'<h3>Saved</h3><div class="grid">'+saved.map(function(p){return '<img src="'+p.img+'">'}).join('')+'</div>':'')+'</div>'}
function adminView(){if(!db.owner)return '<div class="top"><button onclick="go(\'profile\')">\u2039</button><h1 class="logo">Owner desk</h1><span></span></div><div style="padding:16px"><p>Enter FERRARI1 to open the control room.</p><input id="oc" placeholder="Owner code" class="search" style="margin:0"><button class="pri" onclick="unlock()">Unlock</button></div>';return '<div class="top"><button onclick="go(\'profile\')">\u2039</button><h1 class="logo">Admin</h1><span></span></div><div class="admin" style="padding:12px"><p>'+db.users.length+' members \u00b7 '+db.posts.length+' posts</p><table><tr><th>Member</th><th></th></tr>'+db.users.map(function(u){return '<tr><td>@'+u.username+(u.ver?' \u2713':'')+(u.blocked?' (suspended)':'')+'</td><td><button class="pill" onclick="verify(\''+u.id+'\')">Verify</button> <button class="pill" onclick="wipe(\''+u.id+'\')">Wipe</button> <button class="pill" onclick="ban(\''+u.id+'\')">Suspend</button></td></tr>'}).join('')+'</table><button class="edit" onclick="if(confirm(\'Reset demo?\')){localStorage.removeItem(KEY);db=load();go(\'home\')}">Reset demo</button></div>'}
function overlay(){if(openStory){const s=db.stories.find(x=>x.id===openStory);s.seen=true;save(db);const u=usr(s.by);return '<div class="sheet" onclick="openStory=null;render()"><div style="width:min(480px,100%);height:100%;position:relative;background:#000"><img src="'+s.img+'" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;top:16px;left:16px" class="ph">'+av(u)+'<b>'+u.username+'</b></div></div></div>'}if(sheet==="menu")return '<div class="sheet" onclick="if(event.target===this){sheet=null;render()}"><div class="panel"><button class="edit" onclick="go(\'admin\')">Owner desk / Admin panel</button><button class="edit" onclick="sheet=null;db.session=null;save(db);render()">Log out</button><button class="edit" onclick="sheet=null;render()">Close</button></div></div>';if(sheet==="edit")return '<div class="sheet" onclick="if(event.target===this){sheet=null;render()}"><div class="panel"><h3>Edit profile</h3><input id="dn" value="'+me().display+'" class="search" style="margin:8px 0"><textarea id="bio" class="search" style="min-height:80px">'+me().bio+'</textarea><button class="pri" onclick="me().display=$(\'#dn\').value;me().bio=$(\'#bio\').value;save(db);sheet=null;render()">Save</button></div></div>';return ""}
function render(){const root=$("#app");if(!db.session){root.innerHTML='<div class="auth"><div class="box"><h1>Pulse</h1><p>Photos, notes, and messages.</p><input id="id" value="you" placeholder="Username"><input id="pw" type="password" value="pulse123" placeholder="Password"><div class="err" id="err"></div><button class="pri" onclick="login()">Log in</button><button class="ghost" onclick="signup()">Create account</button></div></div>';return}const screens={home:homeView,search:searchView,create:createView,reels:reelsView,profile:profileView,notes:notesView,messages:messagesView,admin:adminView};const body=(screens[route]||homeView)();const tabs=[["home","Home"],["search","Search"],["create","New"],["reels","Reels"],["profile","You"]];root.innerHTML=body+'<nav class="tabbar">'+tabs.map(function(x){return '<button class="'+(route===x[0]?'on':'')+'" onclick="viewUser=null;go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</nav>'+overlay()}
render();
</script>
</body>
</html>
