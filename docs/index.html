<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#000;--card:#111;--line:#232326;--text:#f5f5f7;--muted:#8e8e93;--blue:#0095f6;--red:#ed4956}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:#000;position:relative;padding-bottom:64px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:rgba(0,0,0,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{font-family:"Playfair Display",serif;font-size:24px;margin:0;letter-spacing:-.3px}
.icon{width:38px;height:38px;display:grid;place-items:center;position:relative;color:#fff}
.pip{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 12px 8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{width:68px;flex:0 0 auto;text-align:center;font-size:11px;color:var(--muted)}
.ring{width:62px;height:62px;margin:0 auto 5px;padding:2px;border-radius:50%;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}
.ring.seen{background:#333}
.ring i{height:100%;border-radius:50%;border:2px solid #000;display:grid;place-items:center;font-weight:800;font-size:16px}
.post{border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;flex:0 0 auto;color:#fff}
.nm{font-size:13px;font-weight:700;line-height:1.25}
.nm small{display:block;color:var(--muted);font-weight:500}
.media{background:#0b0b0b;aspect-ratio:1}
.media img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;align-items:center;padding:4px 4px 0}
.acts button{padding:8px}
.acts .r{margin-left:auto}
.meta{padding:0 14px 14px;font-size:14px;line-height:1.45}
.likes{font-weight:700;margin:2px 0 4px}
.time{color:var(--muted);font-size:11px;margin-top:6px;text-transform:uppercase;letter-spacing:.3px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);display:flex;background:#000;border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{flex:1;color:#8e8e93;padding:6px 0}
.tabbar button.on{color:#fff}
.auth{min-height:100dvh;display:grid;place-items:center;padding:28px 22px;padding-bottom:40px}
.box{width:100%;text-align:center}
.box h1{font-family:"Playfair Display",serif;font-size:46px;margin:0 0 6px}
.box p{color:var(--muted);margin:0 0 22px;font-size:14px}
.box input{width:100%;background:#121212;border:1px solid #2c2c2e;border-radius:12px;padding:13px 14px;margin:6px 0}
.box input:focus{outline:1px solid #3a3a3c}
.pri{width:100%;background:var(--blue);color:#fff;border-radius:12px;padding:12px;font-weight:700;margin-top:10px}
.ghost{color:#d0d0d0;margin-top:18px;font-size:14px}
.ghost b{color:var(--blue)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
.search{margin:10px 12px;background:#1c1c1e;border-radius:11px;padding:10px 12px;width:calc(100% - 24px);border:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img,.tile{aspect-ratio:1;width:100%;object-fit:cover;background:#1a1a1a;border:0}
.sheet{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.panel{width:min(430px,100%);background:#161616;border-radius:18px 18px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.handle{width:36px;height:4px;border-radius:99px;background:#3a3a3c;margin:6px auto 10px}
.sheetbtn{display:block;width:100%;text-align:left;padding:14px 6px;border-bottom:1px solid #242424;font-weight:600}
.reels{height:calc(100dvh - 58px);overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:calc(100dvh - 58px);scroll-snap-align:start;position:relative;background:#111}
.reel img{width:100%;height:100%;object-fit:cover}
.reel .ov{position:absolute;left:14px;right:72px;bottom:28px;text-shadow:0 1px 8px #000}
.reel .side{position:absolute;right:8px;bottom:90px;display:grid;gap:18px;text-align:center;font-size:12px}
.prof{padding:12px 14px 80px}
.stats{display:flex;gap:20px;margin-left:auto;font-size:12px;color:var(--muted);text-align:center}
.stats b{color:#fff;display:block;font-size:16px}
.edit{border:1px solid #333;border-radius:10px;padding:8px 12px;font-weight:700;width:100%;margin:10px 0}
.chat{padding:8px 12px 96px}
.bubble{max-width:78%;padding:9px 12px;border-radius:18px;margin:6px 0;background:#1c1c1e;font-size:14px}
.bubble.me{background:#00376b;margin-left:auto}
.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:58px;width:min(430px,100%);display:flex;gap:8px;padding:8px 10px;background:#000;border-top:1px solid var(--line)}
.composer input{flex:1;background:#1c1c1e;border:0;border-radius:22px;padding:10px 14px}
.admin{padding:12px 12px 80px}
.admin table{width:100%;border-collapse:collapse;font-size:13px}
.admin td,.admin th{border-bottom:1px solid #222;padding:10px 4px;text-align:left}
.pill{background:#1c1c1e;border-radius:8px;padding:6px 8px;font-size:12px;margin:2px}
.row{display:flex;align-items:center}
.pad{padding:16px}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--blue);color:#fff;font-size:8px;margin-left:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.list{padding-bottom:80px}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app.js?v=5"></script>
</body>
</html>
