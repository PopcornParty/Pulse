<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:72px}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}img{display:block;max-width:100%}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#000;border-bottom:1px solid #222}
.logo{font-family:"Playfair Display",serif;font-size:24px;margin:0}
.stories{display:flex;gap:12px;overflow:auto;padding:12px;scrollbar-width:none}
.st{width:68px;flex:0 0 auto;text-align:center;font-size:11px;color:#8e8e93}
.ring{width:62px;height:62px;margin:0 auto 5px;padding:2px;border-radius:50%;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}
.ring i{display:block;height:100%;border-radius:50%;border:2px solid #000}
.post{border-bottom:1px solid #222}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.nm{font-size:13px;font-weight:700}.nm small{display:block;color:#8e8e93;font-weight:500}
.media{aspect-ratio:1;background:#111}.media img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;gap:4px;padding:6px 8px;flex-wrap:wrap}
.acts button{padding:6px 8px;font-size:13px;font-weight:700}
.meta{padding:0 14px 14px;font-size:14px}
.likes{font-weight:700;margin-bottom:4px}.time{color:#8e8e93;font-size:11px;margin-top:6px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);display:flex;background:#000;border-top:1px solid #222;padding:8px 0 16px;z-index:6}
.tabbar button{flex:1;color:#8e8e93;font-weight:700;font-size:11px}.tabbar button.on{color:#fff}
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.box{width:100%;text-align:center}
.box h1{font-family:"Playfair Display",serif;font-size:44px;margin:0 0 8px}
.box p{color:#8e8e93}
.box input,.field{width:100%;background:#121212;border:1px solid #2c2c2e;border-radius:12px;padding:13px;margin:6px 0}
.pri{width:100%;background:#0095f6;color:#fff;border-radius:12px;padding:12px;font-weight:700;margin-top:10px}
.ghost{margin-top:16px;color:#ccc}.ghost b{color:#0095f6}
.err{color:#ed4956;font-size:13px;min-height:18px}
.pad{padding:16px}.muted{color:#8e8e93;font-size:13px}
.edit{border:1px solid #333;border-radius:10px;padding:8px 12px;font-weight:700;width:100%;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{aspect-ratio:1;width:100%;object-fit:cover;background:#111}
.chat{padding:10px 12px 90px}
.bubble{max-width:78%;padding:9px 12px;border-radius:16px;margin:6px 0;background:#1c1c1e}
.bubble.me{background:#00376b;margin-left:auto}
.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:58px;width:min(430px,100%);display:flex;gap:8px;padding:8px;background:#000}
.composer input{flex:1;background:#1c1c1e;border-radius:20px;padding:10px 12px}
.sheet{position:fixed;inset:0;background:#000c;z-index:8;display:flex;align-items:flex-end}
.panel{width:min(430px,100%);margin:0 auto;background:#161616;border-radius:16px 16px 0 0;padding:14px 14px 28px;max-height:80dvh;overflow:auto}
.sheetbtn{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid #2a2a2a;font-weight:600}
.stats{display:flex;gap:16px;margin-left:auto;text-align:center;font-size:12px;color:#8e8e93}
.stats b{display:block;color:#fff;font-size:16px}
.pill{background:#1c1c1e;border-radius:8px;padding:6px 8px;margin:2px;font-size:12px}
.banner{background:#1a1208;color:#f7c948;padding:8px 12px;font-size:12px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kpi div{background:#121212;border:1px solid #222;border-radius:12px;padding:10px}
.kpi b{display:block;font-size:18px}
</style>
</head>
<body>
<div id="app"><div class="auth"><div class="box"><h1>Pulse</h1><p>Loading…</p></div></div></div>
<script src="./pulse-a.js?v=10"></script>
<script src="./pulse-b1.js?v=10"></script>
<script src="./pulse-b2.js?v=10"></script>
</body>
</html>
